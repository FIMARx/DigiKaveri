name: Supabase Keep-Alive

# Supabase's free tier pauses a project after 7 days with zero API requests,
# requiring a manual "unpause" click in their dashboard. This pings the
# promo_codes table on Mon/Wed/Fri, so the longest possible gap is 3 days -
# comfortably under the 7-day threshold - and it never goes to sleep again.
on:
  schedule:
    - cron: '0 6 * * 1,3,5'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase promo_codes table
        run: |
          curl -sf "https://hmwaplhxstzhhrjzgxxv.supabase.co/rest/v1/promo_codes?select=code&limit=1" \
            -H "apikey: sb_publishable_DZcgH9hp8lB21aeqzKdWzw_kv1pxUmz" \
            -H "Authorization: Bearer sb_publishable_DZcgH9hp8lB21aeqzKdWzw_kv1pxUmz" \
            -o /dev/null
